<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>gonzalo.zip</title>

    <meta
        name="description"
        content="somewhere after midnight."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="noise"></div>


    <!-- TOP BAR -->
    <header class="topbar">

        <a class="logo" href="/">
            gonzalo.zip<span>.</span>
        </a>

        <div class="status">
            <span id="temperature">24°C</span>
            <span class="separator">|</span>
            <span id="clock">--:--</span>
        </div>

    </header>


    <!-- MAIN -->
    <main class="hero">

        <div class="hero-content">

            <h1>gonzalo.zip</h1>

            <div class="red-line"></div>

            <p class="subtitle">
                somewhere after midnight.
            </p>


            <!-- SOCIAL LINKS -->
            <nav class="socials">

                <!-- INSTAGRAM -->
                <a
                    href="https://www.instagram.com/gonzalop54/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    instagram
                </a>

                <span>/</span>


                <!-- SPOTIFY -->
                <button
                    class="spotify-trigger"
                    id="spotifyTrigger"
                    type="button"
                >
                    spotify
                </button>

                <span>/</span>


                <!-- YOUTUBE -->
                <a
                    href="https://www.youtube.com/watch?v=f_WuRfuMXQw"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    youtube
                </a>

                <span>/</span>


                <!-- MAIL - DECORATIVE -->
                <a
                    href="#"
                    onclick="return false;"
                    aria-label="mail"
                >
                    mail
                </a>

            </nav>


            <!-- SMALL AUDIO ANIMATION -->
            <div class="audio-mark" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            bass is a feeling<span>.</span>
        </p>

        <p>
            currently driving<span>.</span>
        </p>

        <p>
            keep the streets empty<span>.</span>
        </p>

    </footer>


    <!-- SPOTIFY MODAL -->
    <div
        class="spotify-modal"
        id="spotifyModal"
        aria-hidden="true"
    >

        <!-- DARK BLURRED BACKGROUND -->
        <div
            class="spotify-backdrop"
            id="spotifyBackdrop"
        ></div>


        <!-- SPOTIFY PANEL -->
        <div
            class="spotify-panel"
            role="dialog"
            aria-modal="true"
            aria-label="Spotify playlist"
        >

            <!-- CLOSE -->
            <button
                class="spotify-close"
                id="spotifyClose"
                type="button"
                aria-label="cerrar"
            >
                ×
            </button>


            <!-- LABEL -->
            <div class="spotify-label">
                night transmission<span>.</span>
            </div>


            <!-- PLAYLIST -->
            <iframe
                src="https://open.spotify.com/embed/playlist/34KWfW88GK15EPBo6jM2Wa?utm_source=generator&theme=0"
                width="100%"
                height="352"
                frameborder="0"
                allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
                title="Spotify playlist"
            ></iframe>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
