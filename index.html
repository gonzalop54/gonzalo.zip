</style></head><body><div id="app"></div><script>const money = n => 'US$' + Number(n || 0).toLocaleString('es-AR',{maximumFractionDigits:2});
function total(cards) {
  let n = 0, aces = 0;

}

  if (state.shoe.length < 78) state.shoe=shoe();
  state.cash-=amount;
  const hand={cards:[state.shoe.pop(),state.shoe.pop()],bet:amount,split:false,done:false,doubled:false};
  const dealer=[state.shoe.pop(),state.shoe.pop()];

  if(natural(hand) || total(dealer).value===21) finish(state);
}
function canSplit(state) {
  const r=state.round, h=r?.hands[r.active];
  return !!h && !h.done && r.hands.length===1 && h.cards.length===2 && Math.min(10,rankValue(h.cards[0].rank))===Math.min(10,rankValue(h.cards[1].rank)) && state.cash>=h.bet;
}
function rankValue(rank) { return rank==='A'?11:['J','Q','K'].includes(rank)?10:Number(rank); }
function canDouble(state) { const r=state.round,h=r?.hands[r.active]; return !!h && !h.done && h.cards.length===2 && state.cash>=h.bet; }

  const r=state.round,h=r?.hands[r.active]; if(!h || h.done) throw Error('No hay una mano activa.');
  if(act==='split') {

    state.cash-=h.bet;
    const second={cards:[h.cards.pop(),state.shoe.pop()],bet:h.bet,split:true,done:false,doubled:false};
    h.cards.push(state.shoe.pop()); h.split=true; r.hands.push(second);

      <div class="quick-funds"><label for="addAmount">Dólares ficticios</label><div><input id="addAmount" type="number" min="1" step="1" value="1000" aria-label="Cantidad de dólares ficticios"><button data-act="add">Agregar US$</button></div></div>
      <div class="quick-utilities"><button data-act="rules">Reglas</button><button data-act="reset">Reiniciar partida</button></div>
    </div>
    <div class="game-help">${live?'<b>H</b> Pedir &nbsp; <b>S</b> Plantarse &nbsp; <b>D</b> Doblar &nbsp; <b>P</b> Separar':'<b>↑ ↓</b> Ajustar apuesta &nbsp; <b>ESPACIO</b> Repartir'}</div>
    <div class="gta-hud"><div class="hud-top"><span class="hud-symbol">♠</span><time>${clock()}</time></div><div class="hud-money">${money(game.cash)}</div></div>
    <div class="dealer-cards cards" aria-label="Cartas del crupier">${r?r.dealer.map((c,i)=>card(c,live&&i===1)).join(''):''}</div>
    <div class="player-cards cards" aria-label="Tus cartas">${r?r.hands.map((h,i)=>`<div class="casino-hand ${live&&r.active===i?'active':''}"><div class="cards">${h.cards.map(c=>card(c)).join('')}</div>${r.hands.length>1?`<small>MANO ${i+1}${r.finished?' · '+r.outcomes[i].label:''}</small>`:''}</div>`).join(''):''}</div>
    ${r?.finished?`<div class="round-banner ${r.net>0?'win':r.net<0?'loss':'push'}" role="status"><strong>${r.net>0?'GANASTE':r.net<0?'PERDISTE':'EMPATE'}</strong><span>${r.net>0?'+':r.net<0?'−':''}${money(Math.abs(r.net))}</span></div>`:''}
    ${started?`<div class="wager-hud"><h2>BLACKJACK</h2><div class="wager-line"><span>APUESTA TOTAL</span><strong id="stake-value">${money(stake)}</strong></div><div class="wager-line"><span>PUNTOS CRUPIER</span><strong>${r?(live?(guess?`? · ≈${guess.withTen}`:'?'):total(r.dealer).value):'—'}</strong>${guess?'<small>Estimado solo por la carta visible</small>':''}</div><div class="wager-line"><span>${r?.hands.length>1&&live?'TU MANO '+(r.active+1):'TUS PUNTOS'}</span><strong>${r?(live?total(r.hands[r.active].cards).value:r.hands.length>1?r.hands.map(h=>total(h.cards).value).join(' / '):total(r.hands[0].cards).value):'—'}</strong></div></div>`:''}
    ${started?`<div class="casino-controls">${!live?`<div class="cinema-bet"><label for="bet">APUESTA</label><div><span>US$</span><input id="bet" type="number" min="100" step="1" value="${bet}" aria-label="Monto de la apuesta"></div><button data-act="all-in">TODO</button></div>`:''}<div class="cinema-actions">${!live?`<button class="button" data-act="deal" ${game.cash<100?'disabled':''}>${r?.finished?'OTRA MANO':'REPARTIR'}</button>`:`<button class="button" data-act="hit">PEDIR</button><button class="button alt" data-act="stand">PLANTARSE</button><button class="button alt" data-act="double" ${canDouble(game)?'':'disabled'}>DOBLAR</button><button class="button alt" data-act="split" ${canSplit(game)?'':'disabled'}>SEPARAR</button>`}</div>${game.cash<100?'<div class="no-cash">Agregá dólares ficticios con el control de arriba.</div>':''}</div>`:''}
    ${showRules?'<div class="rules-overlay" role="dialog" aria-modal="true" aria-label="Reglas del Blackjack"><div class="rules-card"><h2>Reglas de la mesa</h2><p>Buscá acercarte a 21 sin pasarte. El blackjack natural paga 3:2. El crupier pide con 17 suave y se planta con 17 duro. Podés doblar o separar si tenés saldo suficiente; el empate devuelve la apuesta.</p><button data-act="rules">ENTENDIDO</button></div></div>':''}
    ${!started?`<div class="start-screen"><div class="start-panel"><span>CASINO DE LAS VENTURAS</span><h1>BLACKJACK</h1><p>Saldo: ${money(game.cash)} ficticios. Jugá a tu ritmo.</p><button data-act="start">EMPEZAR</button></div></div>`:''}
    ${notice?`<div class="cinema-notice" role="status">${notice}</div>`:''}
  </div>`;
}
function render(){
  const focused=document.activeElement, id=focused?.id, value=focused?.value;
  $('#app').innerHTML=stage();
  if(id&&$('#'+id)&&value!==undefined){$('#'+id).value=value;$('#'+id).focus();}
}
function completed(){if(!game.round?.finished)return;if(!game.round.fxPlayed){resultSound(game.round.net);game.round.fxPlayed=true;}bet=Math.min(bet,Math.floor(game.cash));}
function readAmount(id){return Number($('#'+id)?.value);}
document.addEventListener('input',e=>{if(e.target.id==='bet'){const amount=Number(e.target.value);if(Number.isSafeInteger(amount)&&amount>=0){bet=amount;const stake=$('#stake-value');if(stake)stake.textContent=money(bet);}}});
document.addEventListener('keydown',e=>{
  if(!started||showRules||e.target.closest('input,button,summary'))return;
  const live=game.round&&!game.round.finished;
  if(!live&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(game.cash>=100){bet=Math.max(100,Math.min(Math.floor(game.cash),bet+(e.key==='ArrowUp'?1000:-1000)));render();}return;}
  const act=live?({h:'hit',s:'stand',d:'double',p:'split'})[e.key.toLowerCase()]:e.code==='Space'?'deal':null;
  if(act){e.preventDefault();$(`[data-act="${act}"]`)?.click();}
});
setInterval(()=>{const time=$('.hud-top time');if(time)time.textContent=clock();},10000);
document.addEventListener('click',e=>{
  const button=e.target.closest('[data-act]');if(!button||button.disabled)return;
  const act=button.dataset.act;if(audio)ensureAudio();notice='';
  try{
    if(act==='start'){started=true;if(game.round?.finished)game.round=null;bet=Math.min(5000,Math.floor(game.cash));sound(440,.1,.025);render();return;}
    if(act==='sound'){audio=!audio;try{localStorage.setItem(FX_KEY,audio?'on':'off');}catch{}if(audio)sound(660,.12);render();return;}
    if(act==='music'){setMusic(!music);render();return;}
    if(act==='rules'){showRules=!showRules;render();return;}
    if(act==='reset'){if(!confirm('¿Reiniciar el saldo a US$10.000 y borrar los resultados del Blackjack?'))return;game=fresh();bet=5000;save();render();return;}
    if(act==='all-in'){bet=Math.floor(game.cash);render();return;}
    if(act==='add'){
      const amount=readAmount('addAmount');if(!Number.isSafeInteger(amount)||amount<1||amount>100000000000)throw Error('Elegí un monto entero entre $1 y $100.000.000.000.');
      if(game.cash+amount>Number.MAX_SAFE_INTEGER)throw Error('El saldo máximo permitido ya se alcanzó.');
      game.cash+=amount;if(bet<100)bet=Math.min(5000,Math.floor(game.cash));notice=`Se agregaron ${money(amount)} ficticios.`;
    }else if(act==='deal'){
      const amount=readAmount('bet');begin(game,amount);bet=amount;sound(570);completed();
    }else if(['hit','stand','double','split'].includes(act)){
      action(game,act);sound(act==='hit'?590:430);completed();
    }
    save();render();
  }catch(error){notice=error.message||'Algo salió mal.';render();}
});
render();
</script></body></html>
