<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El botón imposible | gonzalo.zip</title>
    <meta
        name="description"
        content="Un botón que no quiere que lo pulses."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="experiment">
        <a class="back-link" href="../../index.html">← volver a gonzalo.zip</a>

        <section class="game">
            <p class="experiment-number">experimento #001</p>

            <h1>¿Podés pulsar este botón?</h1>

            <p id="message" class="message">
                Parece fácil.
            </p>

            <div id="arena" class="arena">
                <button id="escape-button" class="escape-button">
                    Pulsame
                </button>
            </div>

            <div class="stats">
                <p>
                    Intentos:
                    <strong id="attempts">0</strong>
                </p>

                <p>
                    Tiempo:
                    <strong id="time">0.0</strong>s
                </p>

                <p>
                    Récord:
                    <strong id="record">--</strong>
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
